# .github/workflows/alarm-dispatch.yml — 옵션 B + Path 2 (심의 수정본 v2)
#
# ★ 'schedule:' 없음 = 60일 자동 비활성화 대상 아님 (B 성립 조건).
# ★ 카카오 refresh token은 Supabase(app_secrets)에 회전 저장 → 워크플로 안 GitHub PAT 불필요.
#
# 3차 심의 수정:
#   [최소권한] telegram / kakao 알림을 '별도 스텝'으로 분리.
#              service_role 키는 kakao 스텝 env 에만 주입 → telegram 프로세스에 노출 안 됨.
#   [신호간극] dead-man 을 둘로 분리:
#              (A) 'cron 생존' 핑 — Supabase 핑 직후. 알림 실패에 오염되지 않음.
#              (B) '알림 전송' 핑 — 모든 알림 스텝 성공 후에만. 조용한 미도달을 잡는다.
#
# 트리거: 외부 무료 크론(cron-job.org 등)이 매일 repository_dispatch(event_type: daily-alarm) 발사.

name: alarm-dispatch

on:
  repository_dispatch:
    types: [daily-alarm]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: alarm-dispatch
  cancel-in-progress: false

jobs:
  alarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4   # 하드닝 원하면 커밋 SHA로 핀할 것

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ── 1) 생명 신호: Supabase 핑 (anon 키만) ──
      - name: Supabase ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}   # anon
          KEEPALIVE_TABLE: "tasks"
        run: python jobs/keepalive.py

      # ── 2) dead-man (A) 'cron 생존': 핑 성공 직후. 알림 성공 여부와 무관. ──
      - name: Dead-man ping - cron alive
        run: |
          if [ -n "${HC_CRON:-}" ]; then
            curl -fsS -m 10 --retry 3 "$HC_CRON" >/dev/null && echo "cron-alive pinged"
          else
            echo "HEALTHCHECK_CRON_URL 미설정 — cron 생존 감시 비활성(권장: 설정)"
          fi
        env:
          HC_CRON: ${{ secrets.HEALTHCHECK_CRON_URL }}

      # ── 3) 텔레그램 알림 (service_role 주입 안 함 — 최소권한) ──
      - name: Notify telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}   # anon (tasks 조회)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/telegram_notify.py

      # ── 4) 카카오 알림 (service_role는 여기에만) ──
      - name: Notify kakao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}                            # anon (tasks 조회)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}  # app_secrets 전용
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python jobs/kakao_notify.py

      # ── 5) dead-man (B) '알림 전송': 위 알림 스텝이 모두 성공했을 때만 핑. ──
      #    이게 며칠 결번이면 healthchecks 가 경보 → '핑은 오는데 알림은 안 온다'를 잡는다.
      - name: Dead-man ping - alarm delivered
        run: |
          if [ -n "${HC_SENT:-}" ]; then
            curl -fsS -m 10 --retry 3 "$HC_SENT" >/dev/null && echo "alarm-delivered pinged"
          else
            echo "HEALTHCHECK_SENT_URL 미설정 — 알림 전송 감시 비활성(권장: 설정)"
          fi
        env:
          HC_SENT: ${{ secrets.HEALTHCHECK_SENT_URL }}

      # ── 6) 실패 알림 ──
      - name: Notify failure
        if: ${{ failure() }}
        run: |
          curl -fsS -m 10 \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="alarm-dispatch 실패 ${{ github.repository }} run ${{ github.run_id }}" \
            >/dev/null || echo "telegram notify 실패(알림 채널 자체 문제 가능)"
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
